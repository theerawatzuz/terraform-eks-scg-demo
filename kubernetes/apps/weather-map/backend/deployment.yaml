apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-map-backend
  namespace: weather-map
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-map-backend
  template:
    metadata:
      labels:
        app: weather-map-backend
      annotations:
        # Promtail/Loki annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: 208107894265.dkr.ecr.ap-southeast-1.amazonaws.com/weather-map-backend:prod-20260327-072508
          ports:
            - containerPort: 3001
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "weather-map-backend"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
          envFrom:
            - secretRef:
                name: weather-map-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
