apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-map-backend
  namespace: weather-map
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-map-backend
  template:
    metadata:
      labels:
        app: weather-map-backend
      annotations:
        # Promtail/Loki annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: 030635936907.dkr.ecr.ap-southeast-1.amazonaws.com/weather-map-backend:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: weather-map-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
