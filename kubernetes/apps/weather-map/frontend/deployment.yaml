apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-map-frontend
  namespace: weather-map
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-map-frontend
  template:
    metadata:
      labels:
        app: weather-map-frontend
    spec:
      containers:
        - name: frontend
          image: 030635936907.dkr.ecr.ap-southeast-1.amazonaws.com/weather-map-frontend:latest
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: weather-map-frontend-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
