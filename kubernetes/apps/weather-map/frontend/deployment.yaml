apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-map-frontend
  namespace: weather-map
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-map-frontend
  template:
    metadata:
      labels:
        app: weather-map-frontend
    spec:
      serviceAccountName: default
      containers:
        - name: frontend
          image: 030635936907.dkr.ecr.ap-southeast-1.amazonaws.com/weather-map-frontend:prod-20260326-143941
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: "https://weather-api.thebrainsurf.site"
          envFrom:
            - secretRef:
                name: weather-map-frontend-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
