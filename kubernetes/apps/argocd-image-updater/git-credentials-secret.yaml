# Git Credentials Secret for ArgoCD Image Updater
# ใช้สำหรับ write-back changes ไปที่ Git repository

apiVersion: v1
kind: Secret
metadata:
  name: git-creds
  namespace: argocd
type: Opaque
stringData:
  # สำหรับ HTTPS (GitHub Personal Access Token)
  username: "git"
  password: "YOUR_GITHUB_TOKEN_HERE"

  # หรือใช้ SSH Key (แนะนำ)
  # sshPrivateKey: |
  #   -----BEGIN OPENSSH PRIVATE KEY-----
  #   YOUR_SSH_PRIVATE_KEY_HERE
  #   -----END OPENSSH PRIVATE KEY-----

---
# ConfigMap สำหรับ SSH Known Hosts (ถ้าใช้ SSH)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-ssh-config
  namespace: argocd
data:
  config: |
    Host github.com
      HostName github.com
      User git
      IdentityFile ~/.ssh/id_rsa
      StrictHostKeyChecking no
