apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-kube-prometheus-stack-alertmanager
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'
      routes:
        # Critical alerts - immediate notification
        - match:
            severity: critical
          receiver: 'critical-webhook'
          continue: true
          
        # Warning alerts - less frequent
        - match:
            severity: warning
          receiver: 'warning-webhook'
          continue: true
          
        # Info alerts (HPA scaling events)
        - match:
            severity: info
          receiver: 'info-webhook'
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 24h
          
    receivers:
      - name: 'default'
        webhook_configs:
          - url: 'http://webhook-receiver.monitoring.svc.cluster.local:8080/webhook'
            send_resolved: true
            
      - name: 'critical-webhook'
        webhook_configs:
          - url: 'http://webhook-receiver.monitoring.svc.cluster.local:8080/webhook/critical'
            send_resolved: true
            http_config:
              follow_redirects: true
              
      - name: 'warning-webhook'
        webhook_configs:
          - url: 'http://webhook-receiver.monitoring.svc.cluster.local:8080/webhook/warning'
            send_resolved: true
            
      - name: 'info-webhook'
        webhook_configs:
          - url: 'http://webhook-receiver.monitoring.svc.cluster.local:8080/webhook/info'
            send_resolved: true
            
    inhibit_rules:
      # Inhibit warning if critical is firing
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace', 'pod']
