# Cloudflare API Token Secret
# Store your Cloudflare API token in Kubernetes
# Apply this file BEFORE creating the ClusterIssuer
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "your-cloudflare-api-token-here"

---
# Let's Encrypt ClusterIssuer with Cloudflare DNS-01 Solver
# This ClusterIssuer is configured for thebrainsurf.site domain
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - "thebrainsurf.site"
