# Wildcard Certificate for thebrainsurf.site
# This Certificate resource requests a wildcard certificate for *.thebrainsurf.site
# using the letsencrypt-prod ClusterIssuer with Cloudflare DNS-01 challenge

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cert
  namespace: default
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "*.thebrainsurf.site"
    - "thebrainsurf.site"
  duration: 2160h0m0s # 90 days (Let's Encrypt default)
  renewBefore: 360h0m0s # Renew 15 days before expiration
